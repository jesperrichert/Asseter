services:
  app:
    image: ghcr.io/jesperrichert/asseter:latest
    volumes:
      - "./storage/:/app/storage/"
    ports:
      - "4000:3000"
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_USER: "root"
      POSTGRES_DB: "asseter"
      